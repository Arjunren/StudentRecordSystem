name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: students_test, POSTGRES_USER: students, POSTGRES_PASSWORD: students_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U students -d students_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://students:students_test@localhost:5432/students_test
      JWT_SECRET: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.13', cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m app.migrate
      - run: pytest -q
